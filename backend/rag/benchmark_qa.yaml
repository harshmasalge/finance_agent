# Retrieval benchmark for the filings corpus.
# Ground truth was written by reading the extracted pages of each PDF; `pages` are physical PDF
# page numbers (1-based, the same numbers the /kb/files/{doc_id}#page=N links use). A hit is
# relevant when its (doc_id, page) matches any expected location (strict). The lenient score also
# accepts any page of the same company whose chunk contains every string in `keys`. Questions are phrased the way
# an analyst would ask, not copied from the passage.
questions:
  # ---------------------------------------------------------------- HDFC Bank
